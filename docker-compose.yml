services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      FAKE_PLATFORM_URL: http://fake-platform:4000
      WEBHOOK_SECRET: dev-webhook-secret
      TOKEN_ENCRYPTION_KEY: dev-encryption-key
    depends_on:
      - fake-platform
  fake-platform:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./fake-platform:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4000:4000"
